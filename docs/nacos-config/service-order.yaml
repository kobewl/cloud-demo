# =====================================================================
# service-order 配置中心配置（Data ID: service-order.yaml, Group: cloud-demo）
#
# 使用说明：
#   · 本文件是 Nacos 配置中心里该 Data ID 的"源文件"（配置即代码）。
#   · 修改本文件后，需手动同步到 Nacos 控制台：配置管理 -> 配置列表
#     -> 编辑 service-order.yaml -> 发布（本机地址 http://localhost:18080）
#   · 服务启动时会通过 application.yml 里的 spring.config.import 拉取这里的内容。
# =====================================================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认指向 Windows 服务器 MySQL（10.110.0.170）；跨机器部署时可用 -DMYSQL_HOST=<IP> 覆盖。
    # createDatabaseIfNotExist=true：首次启动自动创建 order_db，免去手动建库。
    url: "jdbc:mysql://${MYSQL_HOST:10.110.0.170}:3306/order_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true"
    username: root
    password: "12345678"
  sql:
    init:
      mode: always                       # 启动时自动执行 schema.sql
      schema-locations: classpath:db/schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true   # 数据库下划线字段自动映射为驼峰属性
  global-config:
    db-config:
      id-type: assign_id                 # 主键用雪花算法（分布式环境不重复）
      # 逻辑删除全局配置：凡是名为 deleted 的字段，查询自动带 WHERE deleted = 0，
      # 删除操作自动变成 UPDATE ... SET deleted = 1（软删除，不物理删数据）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
