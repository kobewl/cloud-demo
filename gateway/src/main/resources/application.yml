server:
  port: 8080                     # 网关统一入口端口（所有服务的请求都从这里进）

spring:
  application:
    name: gateway                # 服务名：注册到 Nacos，供 lb:// 路由发现
  cloud:
    nacos:
      discovery:
        # NACOS_ADDR 覆盖：跨机器部署时传 -DNACOS_ADDR=<Nacos所在机器IP>:8848
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        ip: ${NACOS_IP:}
        username: nacos
        password: nacos
    sentinel:
      # 网关场景必须关闭 Sentinel 的 Servlet 过滤器适配：
      # 否则控制台上会出现 URL 资源，且与网关限流适配器冲突
      filter:
        enabled: false
    gateway:
      routes:
        # 商品服务：/api/product/** 转发到 service-product
        - id: product-route
          uri: lb://service-product
          predicates:
            - Path=/api/product/**
        # 库存服务：/api/stock/** 转发到 service-stock
        - id: stock-route
          uri: lb://service-stock
          predicates:
            - Path=/api/stock/**
        # 订单服务：/api/order/** 转发到 service-order
        - id: order-route
          uri: lb://service-order
          predicates:
            - Path=/api/order/**

# 说明：网关的路由配置刻意留在本地（application.yml），而不是外置到 Nacos 配置中心。
# 理由：网关本身就是"配置即路由"，路由留本地最直观、好排查；
#       且网关配置中心化后路由动态刷新需要额外处理，学习阶段先不引入这个复杂度。
