server:
  port: 8080                     # 网关统一入口端口（所有服务的请求都从这里进）

spring:
  application:
    name: gateway                # 服务名：注册到 Nacos，供 lb:// 路由发现
  cloud:
    nacos:
      discovery:
        # NACOS_ADDR 覆盖：跨机器部署时传 -DNACOS_ADDR=<Nacos所在机器IP>:8848
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        ip: ${NACOS_IP:}
        username: nacos
        password: nacos
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: nacos
        password: nacos
    sentinel:
      # 网关场景必须关闭 Sentinel 的 Servlet 过滤器适配：
      # 否则控制台上会出现 URL 资源，且与网关限流适配器冲突
      filter:
        enabled: false
  config:
    # 配置中心入口（P5 约定）：路由等业务配置外置到 Nacos 的 gateway.yaml。
    # optional: 前缀 = Nacos 里没有这份配置也能启动（不快速失败，路由为空而已）。
    import:
      - optional:nacos:gateway.yaml?refreshEnabled=true

# 说明：路由配置（spring.cloud.gateway.routes）已外置到 Nacos（docs/nacos-config/gateway.yaml）。
# 本文件只保留启动必需项：端口、服务名、Nacos 地址、Sentinel 基础开关。
# 路由变更流程：改 docs/nacos-config/gateway.yaml -> 同步 Nacos -> 网关刷新后自动生效。
