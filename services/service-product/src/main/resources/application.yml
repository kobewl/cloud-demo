server:
  port: 8081                     # 商品服务端口（启动"基础设施"，留在本地；业务/环境配置外置到 Nacos）

spring:
  application:
    name: service-product        # 服务名：Nacos 注册中心 + 配置中心的"身份证"
  cloud:
    nacos:
      discovery:
        # NACOS_ADDR 覆盖：跨机器部署时传 -DNACOS_ADDR=<Nacos所在机器IP>:8848
        # NACOS_IP 覆盖：多网卡机器传 -DNACOS_IP=<本机局域网IP>，防止注册成虚拟网卡地址
        server-addr: ${NACOS_ADDR:10.110.0.170:8848}
        ip: ${NACOS_IP:}
        username: nacos
        password: nacos
        group: cloud-demo
      config:
        server-addr: ${NACOS_ADDR:10.110.0.170:8848}
        username: nacos
        password: nacos
        group: cloud-demo
  config:
    # 配置中心入口（Spring Boot 2.4+ 标准方式，bootstrap 已废弃）：
    # optional: 前缀 = Nacos 里没有这份配置也能启动（不快速失败）；
    # ?refreshEnabled=true = 监听配置变更，配合 @RefreshScope 实现动态刷新。
    import:
      - optional:nacos:service-product.yaml?refreshEnabled=true

# ============ Seata 分布式事务客户端（P8 阶段 A） ============
# 原理：客户端启动 → 读 tx-service-group → 查 vgroup-mapping 知道去 Nacos 找 default 集群
#       → 从 Nacos 拉出 seata-server 地址 → 直连 TC（此后不经过 Nacos）
seata:
  application-id: ${spring.application.name}   # 业务服务身份：连 TC 时报备"我是谁"
  tx-service-group: my_tx_group                # 事务分组：客户端"会员体系"名（三服务必须一致）
  service:
    vgroup-mapping:
      my_tx_group: default                     # 会员体系 → Nacos 里的集群名（三层寻址第②层）
  registry:
    type: nacos                                # 指路：去 Nacos 找 TC（seata-server 注册的服务）
    nacos:
      server-addr: ${NACOS_ADDR:10.110.0.170:8848}
      username: nacos
      password: nacos
      group: cloud-demo                        # 关键！必须和 seata-server 注册的 Nacos 分组一致
      cluster: default                         # 对应 vgroup-mapping 里的 default
  config:
    type: file                                 # 自身配置走本地 file，避免"鸡生蛋"（连TC的配置还要先拉配置中心）

# ============ P9 链路追踪：全采样 + Zipkin 上报地址 ============
# tracing 属启动必需的基础设施观测配置，放本地（不放 Nacos），服务一启动就能上报。
management:
  tracing:
    sampling:
      probability: 1.0              # 学习项目请求量小，全采样保证每次请求都能看到
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_ADDR:10.110.0.170:9411}/api/v2/spans
