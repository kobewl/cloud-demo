server:
  port: 8081                     # 商品服务端口（启动"基础设施"，留在本地；业务/环境配置外置到 Nacos）

spring:
  application:
    name: service-product        # 服务名：Nacos 注册中心 + 配置中心的"身份证"
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848   # Nacos 服务端地址（程序连 8848，浏览器才用 18080）
        username: nacos
        password: nacos
      config:
        server-addr: 127.0.0.1:8848   # 配置中心也指向同一个 Nacos
        username: nacos
        password: nacos
  config:
    # 配置中心入口（Spring Boot 2.4+ 标准方式，bootstrap 已废弃）：
    # optional: 前缀 = Nacos 里没有这份配置也能启动（不快速失败）；
    # ?refreshEnabled=true = 监听配置变更，配合 @RefreshScope 实现动态刷新。
    import:
      - optional:nacos:service-product.yaml?refreshEnabled=true
