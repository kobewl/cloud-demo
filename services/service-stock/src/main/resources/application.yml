server:
  port: 8082                     # 库存服务端口（启动"基础设施"，留在本地；业务/环境配置外置到 Nacos）

spring:
  application:
    name: service-stock          # 服务名：商品服务 Feign 就靠这个名字找到我们
  cloud:
    nacos:
      discovery:
        # NACOS_ADDR 覆盖：跨机器部署时传 -DNACOS_ADDR=<Nacos所在机器IP>:8848
        # NACOS_IP 覆盖：多网卡机器传 -DNACOS_IP=<本机局域网IP>，防止注册成虚拟网卡地址
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        ip: ${NACOS_IP:}
        username: nacos
        password: nacos
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: nacos
        password: nacos
  config:
    # 配置中心入口（Spring Boot 2.4+ 标准方式，bootstrap 已废弃）
    import:
      - optional:nacos:service-stock.yaml?refreshEnabled=true
